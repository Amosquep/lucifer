<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Lucifer</title>
  <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>

  <header class="header">
    <a href="../index.html" class="logo">LUCIFER</a>

    <nav class="navbar">
      <a href="../index.html">Inicio</a>
      <a href="#catalogo">Catálogo</a>
    </nav>

    <a href="#carrito" class="carrito-header" aria-label="Ver carrito">
      🛒 <span id="contador-carrito">0</span>
    </a>
  </header>

  <section class="hero-catalogo">
    <h1>Nuestro Catálogo</h1>
    <p>Descubre todas nuestras prendas elegantes y modernas</p>
  </section>

  <main class="contenedor-principal">
    <section id="catalogo"></section>

    <aside class="carrito-panel" id="carrito">
      <h2>🛒 Carrito</h2>
      <ul id="lista-carrito"></ul>
      <p class="total">Total: $<span id="total">0</span></p>

      <div class="botones-carrito">
        <button type="button" class="btn-vaciar" onclick="vaciarCarrito()">Vaciar</button>
        <button type="button" class="btn-pagar" onclick="pagarWhatsApp()">Pagar</button>
      </div>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Lucifer. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
