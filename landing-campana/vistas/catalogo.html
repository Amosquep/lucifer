<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Lucifer</title>
  <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <h2 class="logo">Lucifer</h2>

      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="#catalogo-productos">Catálogo</a></li>
        <li>
          <a href="#carrito" class="icono-carrito" aria-label="Ver carrito">
            🛒 <span id="contador-carrito">0</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="header-content">
      <h1>Nuestro Catálogo</h1>
      <p>Descubre todas nuestras prendas elegantes y modernas</p>
    </div>
  </header>

  <div id="catalogo"></div>
  <main class="contenedor-principal">
    <section class="catalogo" id="catalogo-productos"></section>

    <aside class="carrito" id="carrito">
      <h2>🛒 Carrito</h2>
      <ul id="lista-carrito"></ul>
      <p class="total">Total: $<span id="total">0</span></p>

      <div class="botones-carrito">
        <button type="button" class="btn-vaciar" onclick="vaciarCarrito()">Vaciar</button>
        <button type="button" class="btn-pagar" onclick="pagarWhatsApp()">Pagar</button>
      </div>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Lucifer. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="../js/catalogo.js"></script>
</body>

</html>
