<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Lucifer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/catalogo.css?v=3">
  <link rel="icon" type="image/x-icon" href="../img/favicon/favicon.ico">
  <title>Catálogo | Lucifer Lencería Premium</title>
  <meta name="description" content="Explora nuestro catálogo premium de lencería, pijamas y mallas.">
  <meta property="og:title" content="Lucifer Lencería Premium">
  <meta property="og:description" content="Pasión, elegancia y atrevimiento en cada prenda.">
  <meta property="og:image" content="https://TU-DOMINIO.com/img/banner.jpg">
  <meta property="og:type" content="website">
</head>

<body>

  <header class="header">
    <a href="#" class="logo-container">

      <img src="../img/logo/logo.png" alt="Lucifer Logo" class="logo-img">

      <span class="logo-text">
        LUCIFER
      </span>

    </a>

    <nav class="navbar">
      <a href="#catalogo">Catálogo</a>
    </nav>

    <a href="#" class="carrito-header" id="btn-carrito" aria-label="Ver carrito">
      🛒 <span id="contador-carrito">0</span>
    </a>
  </header>

  <section class="hero-catalogo">
    <h1>Nuestro Catálogo</h1>
    <p>Descubre todas nuestras prendas elegantes y modernas</p>
  </section>
  <section class="barra-filtros">
    <button class="filtro activo" onclick="filtrarProductos('todos')">Todos</button>
    <button class="filtro" onclick="filtrarProductos('Pijamas')">Pijamas</button>
    <button class="filtro" onclick="filtrarProductos('Mallas')">Mallas</button>
    <button class="filtro" onclick="filtrarProductos('Lencería')">Lencería</button>
  </section>

  <main class="contenedor-principal">
    <section id="catalogo"></section>
  </main>

  <div class="overlay-carrito" id="overlay-carrito"></div>

  <aside class="carrito-modal" id="carrito">
    <button class="cerrar-carrito" type="button" onclick="cerrarCarrito()">×</button>

    <h2>🛒 Detalle del pedido</h2>
    <ul id="lista-carrito"></ul>

    <p class="total">Total: $<span id="total">0</span></p>

    <div class="botones-carrito">
      <button type="button" class="btn-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
      <button type="button" class="btn-pagar" onclick="pagarWhatsApp()">Pedir por WhatsApp</button>
    </div>
  </aside>

  <footer>
    <p>&copy; 2026 Lucifer. Todos los derechos reservados.</p>
  </footer>
  <div class="modal-imagen" id="modal-imagen">

    <span class="cerrar-modal" id="cerrar-modal">×</span>

    <img id="imagen-modal" src="" alt="Imagen producto">

  </div>
  <div class="modal-imagen" id="modal-imagen">
    <span class="cerrar-modal" id="cerrar-modal">×</span>
    <img id="imagen-modal" src="" alt="Imagen producto">
  </div>
  <a href="https://wa.me/573504444527" class="whatsapp-flotante" target="_blank" aria-label="WhatsApp">
    💬
  </a>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="../js/catalogo.js"></script>
</body>

</html>
